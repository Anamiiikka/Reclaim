name: CI

on:
  push:
    branches: [main]
    tags: ['phase-*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Runs first and fast. A leaked key is the one failure that cannot be fixed by
  # a follow-up commit, so it gates everything else.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: No real credentials committed
        run: |
          set -euo pipefail

          fail=0

          # Live Razorpay keys must never appear, in any form.
          if git grep -nE 'rzp_live_[A-Za-z0-9]+' -- . ':!.github/workflows/ci.yml'; then
            echo "::error::a live Razorpay key is present in the repository"
            fail=1
          fi

          # Test keys are low-stakes but still shouldn't be committed. The
          # placeholder in .env.example is all x's, so a real one stands out.
          # -P must precede the pattern; as a trailing flag git reads it as a
          # revision and the check silently never fires.
          if git grep -nP 'rzp_test_(?!x+)[A-Za-z0-9]{10,}' \
               -- . ':!.github/workflows/ci.yml'; then
            echo "::error::a real-looking Razorpay test key is committed; use .env"
            fail=1
          fi

          # Neon connection strings carry a password in the URL.
          if git grep -nE 'npg_[A-Za-z0-9]{8,}' -- . ':!.github/workflows/ci.yml'; then
            echo "::error::a Neon credential is committed"
            fail=1
          fi

          # .env itself must never be tracked.
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked by git"
            fail=1
          fi

          exit $fail

      - name: The scanner itself works
        # A scan that silently matches nothing passes forever. Prove on every run
        # that these patterns still catch a planted key before trusting a clean result.
        run: |
          set -euo pipefail
          probe=$(mktemp -d)
          printf 'KEY=rzp_test_9A8b7C6d5E4f3G\n' > "$probe/leaked"
          printf 'URL=postgres://u:npg_AbCdEf123456@h/db\n' >> "$probe/leaked"
          printf 'KEY=rzp_test_xxxxxxxxxxxxxx\n' > "$probe/placeholder"

          grep -qP 'rzp_test_(?!x+)[A-Za-z0-9]{10,}' "$probe/leaked" \
            || { echo "::error::scanner missed a planted test key"; exit 1; }
          grep -qE 'npg_[A-Za-z0-9]{8,}' "$probe/leaked" \
            || { echo "::error::scanner missed a planted Neon credential"; exit 1; }
          if grep -qP 'rzp_test_(?!x+)[A-Za-z0-9]{10,}' "$probe/placeholder"; then
            echo "::error::scanner flags the .env.example placeholder"; exit 1
          fi
          echo "verified: patterns catch real keys and ignore placeholders"

      - name: .gitignore actually ignores .env
        run: |
          set -euo pipefail
          printf 'SECRET=canary\n' > .env
          if [ -n "$(git status --porcelain .env)" ]; then
            echo "::error::.env is not ignored — a secret could be committed"
            rm -f .env
            exit 1
          fi
          rm -f .env
          echo "verified: git will not stage .env"

  data:
    name: Data & response model
    runs-on: ubuntu-latest
    needs: secrets
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tests
        run: pytest data/ evaluation/ -v --tb=short

      - name: Generator is reproducible across processes
        # The in-process determinism test can't catch a dependency on iteration
        # order or a process-level seed. Two separate runs can.
        run: |
          set -euo pipefail
          python data/generator/generate.py --seed 20260831 --out /tmp/run_a
          python data/generator/generate.py --seed 20260831 --out /tmp/run_b
          if ! diff -r /tmp/run_a /tmp/run_b; then
            echo "::error::same seed produced different data across processes"
            exit 1
          fi
          echo "verified: identical output from separate processes"

      - name: Generated data satisfies the DB constraints
        # Catches schema/generator drift here rather than at load time.
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, sys
          from pathlib import Path

          rows = list(csv.DictReader(Path('/tmp/run_a/payment_attempts.csv').open(encoding='utf-8')))
          problems = []

          for r in rows:
              if r['status'] == 'FAILED' and not r['failure_code']:
                  problems.append(f"{r['id']}: FAILED with no failure_code")
              if int(r['amount_paise']) <= 0:
                  problems.append(f"{r['id']}: non-positive amount")

          ids = [r['id'] for r in rows]
          if len(ids) != len(set(ids)):
              problems.append('duplicate attempt ids')

          if problems:
              for p in problems[:20]:
                  print(f"::error::{p}")
              sys.exit(1)
          print(f"verified: {len(rows)} rows satisfy the schema constraints")
          PY

      - name: Upload dataset
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-dataset
          path: /tmp/run_a
          retention-days: 7

  # Activates on its own once Phase 2 lands package.json. Until then it reports
  # skipped rather than failing, so CI stays honest instead of permanently red.
  app:
    name: Policy engine & API
    runs-on: ubuntu-latest
    needs: secrets
    steps:
      - uses: actions/checkout@v4

      - name: Is there a Node project yet?
        id: check
        run: |
          if [ -f package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no package.json yet — Node tests arrive with Phase 2"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.present == 'true'
        with:
          node-version: '24'
          cache: npm

      - name: Install
        if: steps.check.outputs.present == 'true'
        run: npm ci

      - name: Typecheck
        if: steps.check.outputs.present == 'true'
        run: npm run typecheck --if-present

      - name: Tests
        if: steps.check.outputs.present == 'true'
        run: npm test

      - name: Dashboard builds
        if: steps.check.outputs.present == 'true'
        # A dashboard that does not build is not a deliverable.
        run: |
          cd web
          npm ci
          npx tsc --noEmit
          npm run build

  # The guardrails are the project's central claim. This job states the result in
  # the run summary so it can be read without opening logs.
  guardrails:
    name: Guardrail report
    runs-on: ubuntu-latest
    needs: app
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Summarise
        run: |
          if [ -f package.json ]; then
            echo "### Guardrails" >> "$GITHUB_STEP_SUMMARY"
            echo "See the \`Policy engine & API\` job for G1–G9 results." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Guardrails"
              echo ""
              echo "Not yet implemented — the G1–G9 suite lands in Phase 2."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
